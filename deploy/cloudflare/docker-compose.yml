# Mock detrás de túnel nombrado de Cloudflare (HTTPS público vía tu zona).
# Restringir quién llega al hostname con Cloudflare Access (correos / IdP).
# Ver README.md en este directorio.

services:
  mock:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/api/v1/seguros-bolivar/carga-masiva?page=1&pageSize=1', headers={'Authorization': 'Bearer ' + os.environ['MOCK_TOKEN']}))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2024.10.0
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    depends_on:
      mock:
        condition: service_healthy
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
