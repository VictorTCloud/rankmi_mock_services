# Mock accesible solo vía tailnet (sin exposición pública en Internet).
# El servicio mock comparte la red con tailscale; MagicDNS: http://<TS_HOSTNAME>:8080
# Ver README.md en este directorio.

services:
  tailscale:
    image: tailscale/tailscale:v1.76.1
    hostname: ${TS_HOSTNAME:-mock-seguros}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY is required}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  mock:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    env_file:
      - .env

volumes:
  tailscale-state:
